version: "3.9"

services:
  api:
    container_name: healthcare_api
    build:
      context: .
      dockerfile: Dockerfile
    # Apply pending SQL migrations (db/migrations/) before serving
    command: sh -c "python -m db.migrate && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      # Reach Postgres through the Compose service name; localhost would be the api container itself
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    container_name: healthcare_frontend
    build:
      context: ./app
      args:
        # Browser-visible API URL (the browser runs on the host, so this is the host port, not the service name)
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  db:
    container_name: healthcare_postgres
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    container_name: healthcare_redis
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
