# Render Blueprint for the single hosted demo (Issue #35, docs/deployment.md).
# One environment: API (Docker), frontend (Docker) and a managed PostgreSQL database.
# Synthetic data only. No secrets in this file: they are generated by Render or entered in the dashboard.
services:
  - type: web
    name: healthcare-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Migrations, then the idempotent synthetic demo seed, then the server (scripts/start_api.sh).
    # A failure stops the start, so the health check never passes on an unmigrated database.
    dockerCommand: sh scripts/start_api.sh
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-ai-db
          property: connectionString
      # Mock mode by default. Real mode needs LLM_MODE=real and OPENAI_API_KEY set explicitly (docs/deployment.md).
      - key: LLM_MODE
        value: mock
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      # Receiver URL for the signed escalation webhook (sync: false, dashboard only). Leave it unset on the
      # public demo so delivery is recorded as disabled and no visitor submission reaches a third party (#67).
      - key: WEBHOOK_URL
        sync: false
      # The frontend's public origin, copied from its service page, e.g. https://healthcare-ai-frontend-1s23.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: healthcare-ai-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "3000"
      # Browser-visible, inlined at build time: the API's public URL only. Never a secret.
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      # Browser-visible boolean (#43): shows the seeded demo staff identities. Never a credential.
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"

databases:
  - name: healthcare-ai-db
    plan: free
    databaseName: healthcare_ai
    user: healthcare_ai
